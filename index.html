<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Little Joys Daily Companion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff6ea;--card:#fff;--ink:#2a2140;--mute:#7b7190;--pri:#ff6b3d;--pri2:#ffe6d9;--ok:#25a56a;--okbg:#d9f4e6;--sk:#ffd35c;--ln:#f1e4d3;--sh:0 6px 20px rgba(120,70,30,.08)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17131f;--card:#241e31;--ink:#f6f0ff;--mute:#a99dc0;--pri2:#4a2c22;--okbg:#1d4635;--ln:#382f49;--sh:none}}
:root[data-theme="dark"]{--bg:#17131f;--card:#241e31;--ink:#f6f0ff;--mute:#a99dc0;--pri2:#4a2c22;--okbg:#1d4635;--ln:#382f49;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito","Poppins","Segoe UI",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:0 16px 96px}
.hero{margin:0 -16px 14px;padding:18px 16px 22px;background:linear-gradient(135deg,#ff8a5c,#ff5e7e 60%,#9b5cff);color:#fff;border-radius:0 0 28px 28px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px;letter-spacing:-.5px}
.brand img{height:62px;background:#fff;padding:6px 12px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.15)}.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.hero p{margin:6px 0 0;opacity:.92;font-size:14px}
h2{font-size:17px;margin:0 0 8px}p{margin:4px 0}.mute{color:var(--mute);font-size:14px}.sm{font-size:12px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding:2px}
.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:22px;padding:7px 14px;white-space:nowrap;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--sh)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;width:100%;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:none}.btn.ghost{background:var(--pri2);color:var(--ink);box-shadow:none}.btn.done{background:var(--ok)}
.row{display:flex;gap:6px;align-items:center;margin:8px 0}.row>b{width:68px;font-size:13px}
.opt{flex:1;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 2px;font:inherit;font-size:14px;cursor:pointer}
.opt.on{background:var(--pri2);border-color:var(--pri);font-weight:800}
input,select{width:100%;padding:11px;border:1.5px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin:4px 0 10px}
label{font-size:13px;font-weight:800}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto}nav button{flex:1;border:0;background:none;color:var(--mute);padding:11px 4px;font:inherit;font-weight:800;font-size:13px;cursor:pointer}nav button.on{color:var(--pri)}
.banner{background:var(--pri2);border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:14px;font-weight:700}
.bar{height:12px;background:var(--ln);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,#ff5e7e);border-radius:8px}
.spark{display:flex;gap:4px;align-items:flex-end;height:60px}.spark i{flex:1;background:var(--pri);border-radius:5px 5px 0 0;min-height:5px}.spark i.e{background:var(--ln)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.grid b{font-size:22px;display:block}
.top{display:flex;align-items:center;gap:14px}.ring{width:84px;height:84px;flex:none}
.ph{padding:9px 0;border-bottom:1px dashed var(--ln)}.ph:last-child{border:0}.ph.cur{font-weight:800}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.heat button{aspect-ratio:1;border-radius:9px;border:2px solid transparent;background:var(--ln);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.heat .g{background:var(--okbg)}.heat .s{background:var(--sk)}.heat .t{border-color:var(--pri)}.heat .x{outline:2.5px solid var(--ink)}
.bd{display:flex;flex-wrap:wrap;gap:8px}.bd span{background:var(--pri2);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700}.bd .off{opacity:.35;filter:grayscale(1)}
a{color:var(--pri);font-weight:700}
</style></head><body><main id="app"></main><nav id="nav"></nav>

function newPack(p){K1().items.find(function(i){return i.p==p}).ps=iso(new Date());sv();R()}
var cf=false;function del(){if(!cf){cf=true;R();setTimeout(function(){if(cf){cf=false;R()}},5000);return}cf=false;S.kids=S.kids.filter(function(k){return k.id!=S.a});S.a=null;tab='today';sv();R()}
function ageBand(k){var a=k.age;return(a<2?'Under 2 years: please check with your paediatrician before starting any supplement.':'Use the age band on each pack that matches '+a+' years.')+(a>=2&&k.items.some(function(i){return i.p=='g'})?' Little Joys Multivitamin Gummies are labelled for children aged 2+.':'')}
function avg(k,f,t,m){var s=0,c=0;for(var i=f;i<=t;i++){var v=(k.logs[ago(i)]||{})[m];if(v){s+=v;c++}}return c>=3?s/c:null}
function st(k,n){var d=0,e=0,sk=0;for(var i=0;i<n;i++){var l=k.logs[ago(i)]||{};if(l.sick)sk++;else{e++;if(dd(k,l))d++}}return{d:d,e:e,sk:sk,pct:e?Math.round(d/e*100):0}}
function streak(k){var n=0;for(var i=0;i<90;i++){var l=k.logs[ago(i)]||{};if(dd(k,l))n++;else if(l.sick||i==0)continue;else break}return n}
function left(k,i){var u=0;Object.keys(k.logs).forEach(function(d){var p=k.logs[d].p;if(d>=i.ps&&p&&p[i.p])u++});return i.pack-u}
function sum(k){var s=st(k,7),s2=st(k,28),h=k.h,o='Little Joys progress summary\nChild: '+k.name+', '+k.age+' yrs · '+k.items.map(function(i){return PR[i.p]}).join(', ')+'\nTracking for '+dayN(k)+' days\nDoses given: '+s.d+'/'+s.e+' this week ('+s.pct+'%), '+s2.pct+'% over 28 days; sick days (28d): '+s2.sk+'\n';
['e:Energy','f:Focus','s:Sleep','a:Appetite'].forEach(function(x){var p=x.split(':'),v=avg(k,0,13,p[0]);if(v)o+=p[1]+' avg (1-3): '+v.toFixed(1)+'\n'});
if(h.length)o+='Height: '+h[h.length-1].c+' cm on '+h[h.length-1].d+(h.length>1?' (first: '+h[0].c+' cm on '+h[0].d+')':'');return o}
function cp(){var t=sum(K1());try{navigator.clipboard.writeText(t).then(function(){$('cpb').textContent='✓ Copied'},function(){$('cpb').textContent='Copy not supported here'})}catch(e){$('cpb').textContent='Copy not supported here'}}
function brand(){return'<div class="brand">'+(LOGO?'<img src="'+LOGO+'" alt="Little Joys">':'little joys <span class="dots"><i style="background:#ffd35c"></i><i style="background:#7be0b0"></i><i style="background:#fff"></i></span>')+'</div>'}
function R(){var a=$('app'),nv=$('nav');
if(!S.kids.length||adding){nv.innerHTML='';a.innerHTML='<div class="hero">'+brand()+'<p>Your child’s daily nutrition routine, made simple.</p></div>'+setup();return}
var k=K1(),sp=st(k,7),c=2*Math.PI*34,h='<div class="hero"><div class="top"><div style="flex:1">'+brand()+'<p>'+esc(k.name)+' · Day '+Math.max(1,dayN(k))+' of 84</p><p>'+(streak(k)?'🔥 '+streak(k)+'-day streak':'Start a streak today')+'</p></div><svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c*sp.pct/100+' '+c+'" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" fill="#fff" font-weight="800" font-size="16">'+sp.pct+'%</text></svg></div></div>'
+'<div class="chips">'+S.kids.map(function(x){return'<button class="chip'+(x.id==k.id?' on':'')+'" onclick="S.a='+x.id+';sv();R()">'+esc(x.name)+'</button>'}).join('')+'<button class="chip" onclick="adding=true;R()">+ Add child</button></div>';
a.innerHTML=h+(tab=='today'?today(k):tab=='prog'?prog(k):plan(k));
nv.innerHTML='<div>'+[['today','☀️ Today'],['prog','📈 Progress'],['plan','🗓️ Plan']].map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';R()">'+t[1]+'</button>'}).join('')+'</div>'}
function setup(){var o='';for(var i=1;i<=14;i++)o+='<option value="'+i+'"'+(i==5?' selected':'')+'>'+i+' yr</option>';
return'<div class="card"><h2>'+(S.kids.length?'Add another child':'Set up in one minute')+'</h2><p class="mute">Saved only on this device. Use a nickname, no real names needed.</p><br>'
+'<label>Nickname</label><input id="n" placeholder="e.g. Little Star" maxlength="16"><label>Age</label><select id="age">'+o+'</select>'
+'<label>Which Little Joys products do you use?</label>'+PL.map(function(p){return'<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" id="c_'+p[0]+'" style="width:22px;margin:0"'+(p[0]=='g'?' checked':'')+'><span style="flex:1;font-size:14px">'+p[1]+'</span><input id="d_'+p[0]+'" placeholder="dose on pack" style="width:44%;margin:0"></div>'}).join('')+'<br><label>Daily reminder time</label><input id="time" type="time" value="08:00"><label>Started on</label><input id="start" type="date" value="'+iso(new Date())+'" max="'+iso(new Date())+'">'
+'<button class="btn" onclick="add()">Next: log today →</button>'+(S.kids.length?'<br><br><button class="btn ghost" onclick="adding=false;R()">Cancel</button>':'')+'</div>'}
function today(k){var t=iso(new Date()),l=lg(k,sel),n=new Date(),hm=('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2),late=sel==t&&!dd(k,l)&&!l.sick&&hm>=k.time;
function row(f,lb){return'<div class="row"><b>'+lb+'</b>'+[['Low',1],['OK',2],['Great',3]].map(function(o){return'<button class="opt'+(l[f]==o[1]?' on':'')+'" onclick="pick(\''+f+'\','+o[1]+')">'+o[0]+'</button>'}).join('')+'</div>'}
var q=encodeURIComponent('Little Joys for '+k.name),sd=t.replace(/-/g,'')+'T'+k.time.replace(':','')+'00';
return(late?'<div class="banner">⏰ '+esc(k.name)+'’s '+k.time+' routine isn’t logged yet.</div>':'')+(sel!=t?'<div class="banner">Editing '+sel+' · <a href="#" onclick="sel=iso(new Date());R();return false">back to today</a></div>':'')
+k.items.filter(function(i){return PL.find(function(x){return x[0]==i.p})[2]&&left(k,i)<=7}).map(function(i){return'<div class="banner">📦 '+PR[i.p]+': '+Math.max(left(k,i),0)+' left. Time to reorder!</div>'}).join('')
+'<div class="card"><h2>'+(sel==t?'Today’s routine':'Routine on '+sel)+'</h2><p class="mute" style="margin-bottom:8px">Reminder '+k.time+'</p>'+k.items.map(function(i){var o=l.p&&l.p[i.p];return'<button class="btn'+(o?' done':'')+'" style="margin-bottom:8px;text-align:left" onclick="tp(\''+i.p+'\')">'+(o?'✓ ':'')+PR[i.p]+(i.dose?' · '+esc(i.dose):'')+'</button>'}).join('')+'<p class="sm" style="margin-top:4px">Sick days pause your streak instead of breaking it.</p></div>'
+'<div class="card"><h2>How was the day?</h2><p class="sm">10 seconds. Tap again to undo.</p>'+row('e','Energy')+row('f','Focus')+row('s','Sleep')+row('a','Appetite')+'<button class="opt'+(l.sick?' on':'')+'" style="width:100%;margin-top:6px;padding:11px" onclick="tg(\'sick\')">🤒 '+(l.sick?'Sick day (paused)':'Mark as sick day')+'</button></div>'
+'<div class="card"><h2>Pack tracker</h2>'+k.items.filter(function(i){return PL.find(function(x){return x[0]==i.p})[2]}).map(function(i){var lf=left(k,i);return'<p class="mute">'+PR[i.p]+': '+Math.max(lf,0)+' of '+i.pack+' left</p><div class="bar"><i style="width:'+Math.max(0,Math.min(100,lf/i.pack*100))+'%"></i></div><button class="btn ghost" style="margin:6px 0 10px;padding:8px" onclick="newPack(\''+i.p+'\')">Started a new pack</button>'}).join('')+'</div><button class="btn" style="margin-bottom:12px" onclick="tab=\'prog\';R();scrollTo(0,0)">Save and see progress →</button>'
+'<a target="_blank" rel="noopener" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text='+q+'&dates='+sd+'/'+sd+'&recur=RRULE:FREQ=DAILY">➕ Add a daily reminder to your calendar</a>'}
function prog(k){var s=st(k,7),sp='',hm='';
for(var i=13;i>=0;i--){var v=(k.logs[ago(i)]||{}).e;sp+='<i class="'+(v?'':'e')+'" style="height:'+(v?v*33:8)+'%"></i>'}
for(i=27;i>=0;i--){var d=ago(i),l=k.logs[d]||{};hm+='<button class="'+(l.sick?'s':dd(k,l)?'g':'')+(i==0?' t':'')+(d==sel?' x':'')+'" onclick="setDay(\''+d+'\')">'+d.slice(8)+'</button>'}
var ins=[];['e:energy','f:focus','s:sleep','a:appetite'].forEach(function(x){var p=x.split(':'),r=avg(k,0,6,p[0]),b=avg(k,7,13,p[0]);if(r&&b){var d=r-b;ins.push((d>.25?'⬆️ ':d<-.25?'⬇️ ':'➡️ ')+'Average '+p[1]+' is '+(d>.25?'higher':d<-.25?'lower':'steady')+' vs the week before.')}});
if(s.pct>=80)ins.unshift('🌟 '+s.pct+'% consistency this week. That’s how routines stick.');else if(s.e)ins.unshift('💡 '+s.pct+'% consistency this week. Try pairing the dose with breakfast.');
if(s.sk)ins.push('🤒 '+s.sk+' sick day'+(s.sk>1?'s':'')+' this week, excluded from consistency.');
if(!ins.length)ins=['Log for a few days and your first insights appear here.'];
var hh=k.h,hs=hh.length>1?(hh[hh.length-1].c-hh[0].c).toFixed(1):null,sk=streak(k),bg=[[sk>=7,'🔥 7-day streak'],[sk>=14,'🏅 14-day streak'],[sk>=30,'🏆 30-day streak'],[hh.length>0,'📏 First height'],[s.pct>=85&&s.e>=5,'🌟 Great week']];
return'<div class="card"><h2>This week</h2><div class="grid"><div><b>'+s.d+'/'+s.e+'</b><span class="sm">doses given</span></div><div><b>'+s.pct+'%</b><span class="sm">consistency</span></div><div><b>'+sk+'</b><span class="sm">day streak</span></div></div></div>'
+'<div class="card"><h2>Last 4 weeks</h2><div class="heat">'+hm+'</div><p class="sm" style="margin-top:8px">🟩 given · 🟨 sick · tap any day to add or fix a log</p></div>'
+'<div class="card"><h2>Energy, last 14 days</h2><div class="spark">'+sp+'</div></div>'
+'<div class="card"><h2>Insights</h2>'+ins.map(function(x){return'<p style="margin:6px 0">'+x+'</p>'}).join('')+'</div>'
+'<div class="card"><h2>Height</h2><p class="mute">'+(hh.length?'Latest: '+hh[hh.length-1].c+' cm ('+hh[hh.length-1].d+')'+(hs!==null?' · '+(hs>0?'+':'')+hs+' cm since first entry':''):'Measure monthly, barefoot against a wall.')+'</p><div style="display:flex;gap:8px;margin-top:8px"><input id="ht" type="number" step="0.1" placeholder="cm" style="margin:0"><button class="btn" style="width:110px" onclick="addH()">Save</button></div></div>'
+'<div class="card"><h2>Milestones</h2><div class="bd">'+bg.map(function(b){return'<span class="'+(b[0]?'':'off')+'">'+b[1]+'</span>'}).join('')+'</div></div>'
+'<button class="btn ghost" id="cpb" onclick="cp()">📋 Copy summary to share with your doctor</button>'}
function plan(k){var d=dayN(k),w=Math.max(1,Math.ceil(d/7)),P=[[1,2,'Weeks 1–2: Settling in','Focus only on making it a habit. Don’t expect visible changes yet.'],[3,6,'Weeks 3–6: Building the routine','Watch for small shifts in appetite, energy or mood in your logs.'],[7,12,'Weeks 7–12: First checkpoint','Compare weekly insights with week 1 and add a height reading.'],[13,99,'Week 13+: Review','Look at the trend and talk to your paediatrician about growth and diet.']];
return'<div class="card"><h2>What to expect</h2><div class="bar"><i style="width:'+Math.min(100,d/84*100)+'%"></i></div><p class="sm" style="margin:4px 0 8px">12-week journey · Day '+Math.max(d,1)+'</p>'+P.map(function(p){var c=w>=p[0]&&w<=p[1];return'<div class="ph'+(c?' cur':'')+'">'+(c?'👉 ':'')+p[2]+'<div class="sm" style="font-weight:400">'+p[3]+'</div></div>'}).join('')+'<p class="sm" style="margin-top:8px">Every child is different. Supplements support a balanced diet; they don’t replace it.</p></div>'
+'<div class="card"><h2>Dose guidance</h2><p>'+ageBand(k)+'</p>'+k.items.map(function(i){return'<p class="mute" style="margin-top:6px">'+PR[i.p]+': <b>'+(esc(i.dose)||'dose not set')+'</b></p>'}).join('')+'<p class="sm" style="margin-top:6px">Follow the age-wise table on your pack. Never double up on a missed dose. If your child is unwell, on medication or has allergies, check with your doctor.</p></div>'
+'<div class="card"><h2>Settings</h2><label>Reminder time</label><input type="time" value="'+k.time+'" onchange="K1().time=this.value;sv()">'+k.items.map(function(i,n){return'<label>'+PR[i.p]+' dose</label><input value="'+esc(i.dose)+'" onchange="K1().items['+n+'].dose=this.value.trim();sv()"><label>'+PR[i.p]+' pack size</label><input type="number" value="'+i.pack+'" onchange="K1().items['+n+'].pack=+this.value||30;sv()">'}).join('')+'<label>Age</label><select onchange="K1().age=+this.value;sv();R()">'+Array.from({length:14},function(_,i){return'<option value="'+(i+1)+'"'+(k.age==i+1?' selected':'')+'>'+(i+1)+' yr</option>'}).join('')+'</select><button class="btn ghost" onclick="del()">'+(cf?'Tap again to delete all logs for this child':'Remove this child')+'</button></div>'}
R();
</script></body></html>
